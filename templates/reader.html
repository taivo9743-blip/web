<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chapter_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>img { max-width: 100%; height: auto; display: block; margin: 0 auto; }</style>
</head>
<!-- ĐẢM BẢO CHẮC CHẮN TRANG ĐỌC TRUYỆN TRANH DỌC CUỘN XUỐNG DƯỚI ĐƯỢC MƯỢT MÀ -->
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen overflow-y-auto">

    <header class="p-4 bg-zinc-900/90 backdrop-blur sticky top-0 border-b border-zinc-800 flex justify-between items-center z-50 shadow-md">
        <a href="/comic/{{ manga_path }}" class="text-xs font-bold text-zinc-400 hover:text-white bg-zinc-950 px-2.5 py-1.5 rounded-lg border border-zinc-800">⬅️ Mục lục</a>
        <div class="text-center">
            <h1 class="text-xs font-bold text-zinc-200 truncate max-w-[180px] sm:max-w-none">{{ manga_name }}</h1>
            <p class="text-[9px] text-zinc-500 font-mono mt-0.5">{{ chapter_name }}</p>
        </div>
        <div class="flex gap-1.5">
            {% if prev_chap %} <a href="/comic/{{ manga_path }}/{{ prev_chap }}" class="px-2.5 py-1.5 text-[10px] font-bold bg-zinc-800 hover:bg-zinc-700 rounded-lg transition">⏮️ Trước</a> {% endif %}
            {% if next_chap %} <a href="/comic/{{ manga_path }}/{{ next_chap }}" class="px-2.5 py-1.5 text-[10px] font-bold bg-blue-600 hover:bg-blue-500 rounded-lg transition">Kế Tiếp ⏭️</a> {% endif %}
        </div>
    </header>

    <main class="max-w-2xl mx-auto py-1 bg-black border-x border-zinc-900 space-y-0.5">
        {% for img in images %}
            <img src="/comic-img/{{ manga_path }}/{{ chapter_name }}/{{ img }}" loading="lazy" alt="Trang truyện">
        {% endfor %}
    </main>

    <footer class="p-8 bg-zinc-950 flex justify-center gap-4 border-t border-zinc-900">
        {% if prev_chap %} <a href="/comic/{{ manga_path }}/{{ prev_chap }}" class="px-4 py-2 text-xs font-bold bg-zinc-800 rounded-xl">Chương trước</a> {% endif %}
        {% if next_chap %} <a href="/comic/{{ manga_path }}/{{ next_chap }}" class="px-4 py-2 text-xs font-bold bg-blue-600 rounded-xl">Chương sau</a> {% endif %}
    </footer>

</body>
</html>
