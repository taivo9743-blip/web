<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ manga_name }} - Danh sách chương</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- ĐỂ LẠI KHẢ NĂNG CUỘN TỰ NHIÊN CHO TRANG DANH SÁCH CHƯƠNG -->
<body class="bg-black text-gray-100 font-sans min-h-screen overflow-y-auto">
    <header class="p-4 bg-zinc-900/40 border-b border-zinc-800 flex items-center gap-4">
        <a href="/?tab=truyen" class="text-zinc-400 hover:text-white transition text-xs font-bold bg-zinc-900 px-3 py-1.5 rounded-lg border border-zinc-800">⬅️ Tủ Truyện</a>
        <span class="text-zinc-700">|</span>
        <h1 class="text-xs font-black text-zinc-200">{{ manga_name }}</h1>
    </header>
    <main class="max-w-4xl mx-auto p-6">
        <div class="bg-zinc-900 rounded-2xl border border-zinc-800 p-5 shadow-xl">
            <h2 class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest px-1 mb-4">Danh sách chương hiện có:</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                {% for chap in chapters %}
                <a href="/comic/{{ manga_name }}/{{ chap }}" class="bg-zinc-950 hover:bg-blue-950/40 text-center p-3 rounded-xl border border-zinc-800/80 text-xs font-bold text-zinc-300 hover:text-blue-400 transition truncate">
                    📖 {{ chap }}
                </a>
                {% endfor %}
            </div>
        </div>
    </main>
</body>
</html>
